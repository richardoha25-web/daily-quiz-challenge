name: Keystore to Base64

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore again (same passwords)
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore daily-quiz-release.keystore \
            -alias dailyquiz \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'Pass4word2#' \
            -keypass 'Pass4word2#' \
            -dname "CN=Daily Quiz, OU=Mobile, O=Richard, L=Lagos, ST=Lagos, C=NG"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 daily-quiz-release.keystore > keystore-base64.txt
          echo "Base64 length: $(wc -c < keystore-base64.txt)"

      - name: Upload Base64 text file
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-text
          path: keystore-base64.txt
          retention-days: 3
