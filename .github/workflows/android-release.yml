name: Android Release APK and AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Inject AdMob App ID
        run: |
          if ! grep -q "admob_app_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|<string name="admob_app_id">ca-app-pub-8496227439538798~7943409473</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi
          python3 << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = re.sub(
                  r"(<application[^>]*>)",
                  r'''\1
          <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />''',
                  content,
                  count=1
              )
              with open(path, "w") as f:
                  f.write(content)
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android build-tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/daily-quiz-release.keystore
          test -s android/daily-quiz-release.keystore

      - name: Verify release keystore and alias
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore daily-quiz-release.keystore \
            -alias dailyquiz \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/daily-quiz-release.apk"
          test -f "$APK"
          zipalign -p -f 4 "$APK" "$ALIGNED"
          apksigner sign \
            --ks daily-quiz-release.keystore \
            --ks-key-alias dailyquiz \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          apksigner verify --verbose "$SIGNED"

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner \
            -keystore daily-quiz-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" dailyquiz
          jarsigner -verify "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-release
          path: |
            android/app/build/outputs/apk/release/daily-quiz-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
