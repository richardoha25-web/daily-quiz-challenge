name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Inject AdMob App ID
        run: |
          # Add AdMob App ID string
          if ! grep -q "admob_app_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|<string name="admob_app_id">ca-app-pub-8496227439538798~7943409473</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi
          # Add meta-data to AndroidManifest.xml inside <application>
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/,/android:name=".*MainActivity/ s|<application|<application>\n        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="@string/admob_app_id" />\n        <!-- keep original -->|' android/app/src/main/AndroidManifest.xml || true
            # More reliable approach using a temporary file
            python3 -c '
import re
with open("android/app/src/main/AndroidManifest.xml") as f:
    content = f.read()
if "com.google.android.gms.ads.APPLICATION_ID" not in content:
    content = re.sub(
        r"(<application[^>]*>)",
        r"""\1\n        <meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"@string/admob_app_id\" />""",
        content,
        count=1
    )
    with open("android/app/src/main/AndroidManifest.xml", "w") as f:
        f.write(content)
print("AdMob App ID injected")
'
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
