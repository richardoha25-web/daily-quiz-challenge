name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-debug-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: VITE_ADMOB_TEST_MODE=true npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Harden Android WebView cache
        run: |
          python3 << 'EOF'
          from pathlib import Path
          path = Path("android/app/src/main/java/com/richard/dailyquizchallenge/MainActivity.java")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("""package com.richard.dailyquizchallenge;

import android.os.Bundle;
import android.webkit.WebSettings;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        if (getBridge() != null && getBridge().getWebView() != null) {
            WebSettings settings = getBridge().getWebView().getSettings();
            settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
            getBridge().getWebView().clearCache(true);
            getBridge().getWebView().clearHistory();
            getBridge().getWebView().reload();
        }
    }
}
""")
          EOF
          test -f android/app/src/main/java/com/richard/dailyquizchallenge/MainActivity.java
      - name: Inject AdMob App ID
        run: |
          if ! grep -q "admob_app_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|<string name="admob_app_id">ca-app-pub-8496227439538798~7943409473</string>
</resources>|' android/app/src/main/res/values/strings.xml
          fi
          python3 << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = re.sub(
                  r"(<application[^>]*>)",
                  r'''\1
          <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />''',
                  content,
                  count=1
              )
              with open(path, "w") as f:
                  f.write(content)
              print("AdMob App ID injected successfully")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
