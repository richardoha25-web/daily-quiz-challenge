name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Inject AdMob App ID
        run: |
          # 1. Add the App ID string resource
          if ! grep -q "admob_app_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|<string name="admob_app_id">ca-app-pub-8496227439538798~7943409473</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi

          # 2. Add the meta-data tag inside <application>
          python3 << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = re.sub(
                  r"(<application[^>]*>)",
                  r'''\1
          <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />''',
                  content,
                  count=1
              )
              with open(path, "w") as f:
                  f.write(content)
              print("AdMob App ID injected successfully")
          else:
              print("AdMob App ID already present")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
