name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore daily-quiz-release.keystore \
            -alias dailyquiz \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Daily Quiz, OU=Mobile, O=Richard, L=Lagos, ST=Lagos, C=NG"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-release-keystore
          path: daily-quiz-release.keystore
          retention-days: 1
