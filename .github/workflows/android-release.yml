name: Android Release APK and AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Inject AdMob App ID
        run: |
          if ! grep -q "admob_app_id" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|<string name="admob_app_id">ca-app-pub-8496227439538798~7943409473</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi
          python3 << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = re.sub(
                  r"(<application[^>]*>)",
                  r'''\1
          <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />''',
                  content,
                  count=1
              )
              with open(path, "w") as f:
                  f.write(content)
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/daily-quiz-release.keystore
          test -s android/daily-quiz-release.keystore

      - name: Verify release keystore and alias
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore daily-quiz-release.keystore \
            -alias dailyquiz \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Diagnose release key password
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f diagnostic-keystore.p12
          if keytool -importkeystore \
              -srckeystore daily-quiz-release.keystore \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias dailyquiz \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore diagnostic-keystore.p12 \
              -deststoretype PKCS12 \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEYSTORE_PASSWORD" \
              -noprompt >/dev/null 2>&1; then
            echo "KEY_PASSWORD successfully unlocks the dailyquiz signing key."
          else
            echo "KEY_PASSWORD does NOT unlock the dailyquiz signing key in the restored keystore."
            echo "The release signing failure is a key-password/keystore mismatch."
            exit 1
          fi
          rm -f diagnostic-keystore.p12

      - name: Configure Gradle release signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 << 'EOF'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = '''\n\nandroid {\n    signingConfigs {\n        release {\n            storeFile file("../daily-quiz-release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias "dailyquiz"\n            keyPassword System.getenv("KEY_PASSWORD")\n            storeType "PKCS12"\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n'''
          if "signingConfigs {" not in s:
              p.write_text(s + signing)
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signed APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" app/build/outputs/apk/release/daily-quiz-release.apk

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify signed AAB
        working-directory: android
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-release
          path: |
            android/app/build/outputs/apk/release/daily-quiz-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
